<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a12">
<title>KKTC Avcı Sınavı – Multiple Choice</title>
<style>
:root{--bg:#0b120d;--panel:#131e16;--panel2:#1a281e;--line:#2c3c30;--text:#f4f6f1;--muted:#aab6ac;--gold:#ddb85c;--good:#4fb36a;--bad:#df6666}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(circle at top,#17251a 0,#0b120d 48%,#070c08 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:18px 14px 42px}
header{display:flex;align-items:center;gap:13px;margin:4px 0 16px}
.logo{width:52px;height:52px;border-radius:15px;background:var(--gold);color:#17130b;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 8px 26px #0007}
h1{font-size:21px;margin:0 0 3px} .sub{font-size:12px;color:var(--muted);line-height:1.35}
.modebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:14px 0}
.mode{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 8px;border-radius:12px;font-weight:700;font-size:12px}
.mode.active{background:var(--gold);color:#18130a;border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:9px 6px}
.stat b{display:block;font-size:17px} .stat span{font-size:11px;color:var(--muted)}
.progress{height:7px;background:#050a06;border:1px solid #1b281e;border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress div{height:100%;width:0;background:var(--gold);transition:width .2s}
.card{background:linear-gradient(180deg,#162219,#101a13);border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 18px 50px #0007}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:13px}
.q{font-size:21px;line-height:1.35;font-weight:800;margin-bottom:17px}
.options{display:grid;gap:9px}
.opt{width:100%;border:1px solid #34463a;background:#0e1711;color:var(--text);padding:13px 13px;border-radius:12px;text-align:left;font-size:15px;line-height:1.3;display:flex;gap:10px;align-items:flex-start}
.opt .letter{min-width:25px;height:25px;border-radius:8px;background:#1b2a1f;color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:12px}
.opt:disabled{opacity:1} .opt.correct{background:#16331e;border-color:var(--good)} .opt.wrong{background:#381a1b;border-color:var(--bad)}
.opt.correct .letter{background:var(--good);color:#071009} .opt.wrong .letter{background:var(--bad);color:white}
.feedback{display:none;margin-top:15px;padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.45}
.feedback.show{display:block} .feedback strong{display:block;margin-bottom:6px}
.feedback.good strong{color:#79d58e} .feedback.bad strong{color:#ff9191}
.answerline{margin-top:7px;color:#e3e9e4} .bg{margin-top:8px;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;margin-top:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:12px;font-weight:750}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#18130a;flex:1}
.btn.hidden{display:none}
.end{display:none;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 18px}
.end.show{display:block} .scorebig{font-size:54px;font-weight:900;color:var(--gold);margin:8px 0} .end p{color:var(--muted)}
.endActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.footer{margin-top:16px;text-align:center;color:#7f8d82;font-size:11px;line-height:1.45}
@media(max-width:520px){.q{font-size:19px}.opt{font-size:14px;padding:12px 11px}.modebar{grid-template-columns:1fr 1fr}.mode:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">✓</div>
<div>
<h1>KKTC Avcı Sınavı</h1>
<div class="sub">Multiple choice çalışma testi • 39 soru • Türkçe sorular + Bulgarca açıklama</div>
</div>
</header>

<div class="modebar">
<button class="mode active" data-mode="all">Tüm 39 Soru</button>
<button class="mode" data-mode="20">Rastgele 20</button>
<button class="mode" data-mode="wrong">Yanlışlarım</button>
</div>

<div id="game">
<div class="stats">
<div class="stat"><b id="correctN">0</b><span>Doğru</span></div>
<div class="stat"><b id="wrongN">0</b><span>Yanlış</span></div>
<div class="stat"><b id="percent">0%</b><span>Başarı</span></div>
</div>
<div class="progress"><div id="bar"></div></div>

<div class="card">
<div class="topline"><span id="count"></span><span id="modeName">Tüm sorular</span></div>
<div class="q" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback">
<strong id="feedbackTitle"></strong>
<div class="answerline" id="answerLine"></div>
<div class="bg" id="bg"></div>
</div>
<div class="actions">
<button class="btn" id="restart">Baştan</button>
<button class="btn primary hidden" id="next">Sonraki soru</button>
</div>
</div>
</div>

<div class="end" id="end">
<div>Sınav tamamlandı</div>
<div class="scorebig" id="finalScore"></div>
<p id="finalText"></p>
<div class="endActions">
<button class="btn" id="retryWrong">Yanlışları çöz</button>
<button class="btn primary" id="again">Tekrar başla</button>
</div>
</div>

<div class="footer">
Çalışma amaçlı hazırlanmıştır. Resmî sınav ve yürürlükteki mevzuat esas alınmalıdır.<br>
Yanlış yaptığın sorular bu telefonda otomatik kaydedilir.
</div>
</div>

<script>
const BANK=[{"id": 1, "q": "Avcı Adayı için asgari yaş kaçtır?", "options": ["18", "20", "21", "22"], "answer": "21", "bg": "Кандидатът за ловец трябва да е навършил 21 години."}, {"id": 2, "q": "Öğrenci Avcı Adayı hangi yaş grubundadır?", "options": ["16–18", "18 yaşını doldurmuş, 22 yaşından gün almamış", "21–25", "22 yaş ve üzeri"], "answer": "18 yaşını doldurmuş, 22 yaşından gün almamış", "bg": "Ученик-кандидат ловец е навършил 18 години, но още не е навлязъл в 22-рата си година."}, {"id": 3, "q": "Av Ruhsatı almak için temel şartlar hangisidir?", "options": ["18 yaşını doldurmak ve kimlik kartı taşımak", "21 yaşını doldurmak, engeli bulunmamak, eğitimi tamamlamak ve sınavı geçmek", "Sadece ateşli silah belgesine sahip olmak", "En az 5 yıl avcılık yapmış olmak"], "answer": "21 yaşını doldurmak, engeli bulunmamak, eğitimi tamamlamak ve sınavı geçmek", "bg": "Основните условия са 21+, липса на законова пречка, завършено обучение и успешно положен изпит."}, {"id": 4, "q": "Tüzüğe göre “Av Hayvanları” hangi grupları kapsar?", "options": ["Sadece av kuşları", "Sadece ova tavşanı", "Ova tavşanı ve av kuşları", "Tüm yabani hayvanlar"], "answer": "Ova tavşanı ve av kuşları", "bg": "По наредбата ловните животни включват полския заек и ловните птици."}, {"id": 5, "q": "Aşağıdakilerden hangisi tüzükte sayılan av kuşlarına örnektir?", "options": ["Turaç, sülün, keklik ve bıldırcın", "Kartal, flamingo, leylek ve pelikan", "Baykuş, şahin, doğan ve akbaba", "Serçe, kanarya, papağan ve martı"], "answer": "Turaç, sülün, keklik ve bıldırcın", "bg": "Сред изброените ловни птици са turaç, sülün, keklik, cikla, culluk, bıldırcın, üveyik и др."}, {"id": 6, "q": "Merkezi Av Komisyonu (MAK) hangi bakanlık bünyesinde kurulur?", "options": ["Sağlık Bakanlığı", "Tarım Bakanlığı", "İçişleri Bakanlığı", "Eğitim Bakanlığı"], "answer": "İçişleri Bakanlığı", "bg": "Централната ловна комисия е към Министерството на вътрешните работи."}, {"id": 7, "q": "Avcı Eğitim Komisyonuna en fazla kaç ücretli eğitmen atanabilir?", "options": ["3", "5", "8", "10"], "answer": "5", "bg": "Максимум 5 платени обучители."}, {"id": 8, "q": "Ücretli eğitmenlere ek olarak en fazla kaç gönüllü yardımcı eğitmen atanabilir?", "options": ["5", "8", "10", "15"], "answer": "10", "bg": "Допълнително могат да бъдат назначени максимум 10 доброволни помощник-инструктори."}, {"id": 9, "q": "Avcı Eğitim Komisyonu toplamda en fazla kaç kişiden oluşabilir?", "options": ["10", "12", "15", "20"], "answer": "15", "bg": "5 платени + 10 доброволни помощници = максимум 15 души."}, {"id": 10, "q": "Veterinerlik alanındaki eğitmen için hangi şart aranır?", "options": ["Veteriner Hekimliği eğitimi almış olmak ve eğitim verebilecek niteliği MAK’a kanıtlamak", "En az 10 yıl avcılık yapmış olmak", "Sadece lise mezunu olmak", "Polis teşkilatında görev yapmış olmak"], "answer": "Veteriner Hekimliği eğitimi almış olmak ve eğitim verebilecek niteliği MAK’a kanıtlamak", "bg": "Изисква се ветеринарно образование и доказана пред MAK годност за преподаване."}, {"id": 11, "q": "Orman veya Çevre eğitmeni için temel eğitim şartı nedir?", "options": ["Herhangi bir lise diploması", "Orman veya Çevre alanında yükseköğrenim lisansı", "5 yıllık avcılık deneyimi", "Ateşli silah tasarruf belgesi"], "answer": "Orman veya Çevre alanında yükseköğrenim lisansı", "bg": "Необходимо е висше образование в областта на горското дело или околната среда."}, {"id": 12, "q": "Ateşli silah eğitmeni için aşağıdakilerden hangisi yeterli olabilecek deneyimlerden biridir?", "options": ["Ateşli silah kullanan bir birimde çalışmış olmak", "Sadece av ruhsatına sahip olmak", "Bir yıl spor kulübünde bulunmak", "Sadece sağlık eğitimi almış olmak"], "answer": "Ateşli silah kullanan bir birimde çalışmış olmak", "bg": "Един от допустимите варианти е опит в звено, което използва огнестрелно оръжие; наредбата предвижда и други алтернативи за доказване на квалификация."}, {"id": 13, "q": "Sağlık eğitmeni hangi konularda eğitim verebilmelidir?", "options": ["Yaralanma, yılan sokması, kırık ve benzeri ilk yardım konuları", "Sadece silah temizliği", "Sadece av haritası okuma", "Sadece hayvan türlerini tanıma"], "answer": "Yaralanma, yılan sokması, kırık ve benzeri ilk yardım konuları", "bg": "Здравният инструктор трябва да може да обучава по теми като наранявания, ухапване от змия, счупвания и първа помощ."}, {"id": 14, "q": "Avcılık alanındaki eğitmen için asgari avcılık deneyimi kaç yıldır?", "options": ["3", "5", "8", "10"], "answer": "5", "bg": "Минимум 5 години ловен опит."}, {"id": 15, "q": "Komisyon üyeleri için asgari öğrenim şartı nedir?", "options": ["İlkokul", "Ortaokul", "Lise", "Üniversite"], "answer": "Lise", "bg": "Членовете на комисията трябва да са поне със средно образование."}, {"id": 16, "q": "Komisyon üyelerinde ateşli silah mevzuatı açısından hangi şart aranır?", "options": ["Ateşli silahlarla ilgili suçlardan hüküm giymemiş olmak", "En az iki silaha sahip olmak", "Her yıl yeni silah satın almak", "Polis memuru olmak"], "answer": "Ateşli silahlarla ilgili suçlardan hüküm giymemiş olmak", "bg": "Изисква се лицето да не е осъждано за деяния, свързани с нарушения/престъпления по закона за огнестрелните оръжия."}, {"id": 17, "q": "Avcı eğitimleri nerelerde yapılabilir?", "options": ["Yalnızca belediye binalarında", "MAK’ın belirlediği okul, poligon, arazi ve toplantı yerlerinde; ayrıca belirlenen eğitim avlağında", "Sadece özel evlerde", "Sadece polis karakollarında"], "answer": "MAK’ın belirlediği okul, poligon, arazi ve toplantı yerlerinde; ayrıca belirlenen eğitim avlağında", "bg": "Обучението може да се провежда на места, определени от MAK, включително училища, стрелбища, терени и учебен ловен район."}, {"id": 18, "q": "Ateşli silahla ilgili uygulamalı atışlar nerede yapılır?", "options": ["Her açık arazide", "Atış poligonlarında", "Avlanmaya açık bölgede", "Polis karakolunda"], "answer": "Atış poligonlarında", "bg": "Практическата стрелба се провежда на стрелбище."}, {"id": 19, "q": "Ateşli silah eğitiminin kapsamı hangisidir?", "options": ["Sadece nişan alma", "Güvenli kullanım, taşıma ve atış teknikleri", "Sadece silah temizliği", "Sadece av tüfeği satın alma"], "answer": "Güvenli kullanım, taşıma ve atış teknikleri", "bg": "Обучението включва безопасно използване, пренасяне и техники на стрелба."}, {"id": 20, "q": "Avcı eğitiminde coğrafya ile ilgili ne öğretilir?", "options": ["Genel coğrafyanın öğretilmesini mümkün kılacak bilgiler", "Sadece dünya başkentleri", "Sadece denizcilik haritaları", "Sadece yol işaretleri"], "answer": "Genel coğrafyanın öğretilmesini mümkün kılacak bilgiler", "bg": "Предвиждат се знания, позволяващи преподаване на обща география."}, {"id": 21, "q": "Sağlık ve ilk yardım eğitimi hangi durumları kapsar?", "options": ["Sadece spor yaralanmaları", "Kaza, yaralanma ve zehirlenmelerde sağlık ve ilk yardım", "Sadece yılan sokması", "Sadece kırıklar"], "answer": "Kaza, yaralanma ve zehirlenmelerde sağlık ve ilk yardım", "bg": "Покриват се инциденти, наранявания, отравяния и първа помощ."}, {"id": 22, "q": "Av haritası eğitiminde ne öğrenilir?", "options": ["Sadece köy sınırları", "Açık ve yasak avlanma bölgeleri", "Sadece yollar", "Sadece sulak alanlar"], "answer": "Açık ve yasak avlanma bölgeleri", "bg": "Трябва да се знаят районите, разрешени и забранени за лов."}, {"id": 23, "q": "Doğal yaşamla ilgili eğitimde hangi hayvanlar ele alınır?", "options": ["Sadece evcil hayvanlar", "K.K.T.C.’nde doğal yaşamda mevcut olan hayvanlar", "Sadece çiftlik hayvanları", "Sadece deniz canlıları"], "answer": "K.K.T.C.’nde doğal yaşamda mevcut olan hayvanlar", "bg": "Разглеждат се животните, които се срещат в естествената среда на Северен Кипър."}, {"id": 24, "q": "Doğal yaşam alanları konusunda doğru yaklaşım hangisidir?", "options": ["Bitki örtüsünü temizlemek", "Yaşam alanlarına ve doğal bitki örtüsüne zarar vermemek", "Sadece av hayvanlarını korumak", "Araçla her alana girmek"], "answer": "Yaşam alanlarına ve doğal bitki örtüsüne zarar ve nswer": "İçişleri ile ilgili Bakanlığa bağlı Merkezi Av Komisyonu", "bg": "Изпълнението е от Централната ловна комисия към ресорното Министерство на вътрешните работи."}, {"id": 39, "q": "Tüzük ne zaman yürürlüğe girer?", "options": ["İmzalandıktan 30 gün sonra", "Yılbaşında", "Resmî Gazete’de yayımlandığı tarihte", "Sınav döneminde"], "answer": "Resmî Gazete’de yayımlandığı tarihte", "bg": "Наредбата влиза в сила от датата на публикуването ѝ в Държавен вестник."}];
const letters=["A","B","C","D"];
let mode="all", list=[], i=0, correct=0, wrong=0, locked=false;
let savedWrong=new Set(JSON.parse(localStorage.getItem("avciWrongIds")||"[]"));

const $=id=>document.getElementById(id);
const shuffle=a=>{let x=[...a];for(let j=x.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[x[j],x[k]]=[x[k],x[j]]}return x};

function buildList(){
  if(mode==="20") list=shuffle(BANK).slice(0,20);
  else if(mode==="wrong"){
    list=shuffle(BANK.filter(q=>savedWrong.has(q.id)));
    if(!list.length){ alert("Kayıtlı yanlış soru yok. Önce bir test çöz."); mode="all"; syncModes(); list=shuffle(BANK); }
  } else list=shuffle(BANK);
}

function syncModes(){
 document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 $("modeName").textContent=mode==="20"?"Rastgele 20":mode==="wrong"?"Yanlışlarım":"Tüm sorular";
}

function start(){
 buildList(); i=0; correct=0; wrong=0; locked=false;
 $("game").style.display="block"; $("end").classList.remove("show");
 syncModes(); render();
}

function render(){
 if(i>=list.length) return finish();
 locked=false;
 const q=list[i];
 $("count").textContent=`Soru ${i+1} / ${list.length}`;
 $("question").textContent=q.q;
 $("feedback").className="feedback";
 $("next").classList.add("hidden");
 const opts=shuffle(q.options);
 const box=$("options"); box.innerHTML="";
 opts.forEach((o,idx)=>{
   const b=document.createElement("button");
   b.className="opt";
   b.dataset.value=o;
   b.innerHTML=`<span class="letter">${letters[idx]}</span><span>${o}</span>`;
   b.onclick=()=>choose(b,q);
   box.appendChild(b);
 });
 updateStats();
 $("bar").style.width=`${(i/list.length)*100}%`;
}

function choose(btn,q){
 if(locked) return; locked=true;
 const isRight=btn.dataset.value===q.answer;
 if(isRight){ correct++; savedWrong.delete(q.id); }
 else { wrong++; savedWrong.add(q.id); btn.classList.add("wrong"); }
 [...document.querySelectorAll(".opt")].forEach(b=>{
   b.disabled=true;
   if(b.dataset.value===q.answer) b.classList.add("correct");
 });
 localStorage.setItem("avciWrongIds",JSON.stringify([...savedWrong]));
 $("feedback").className="feedback show "+(isRight?"good":"bad");
 $("feedbackTitle").textContent=isRight?"Doğru ✓":"Yanlış ✕";
 $("answerLine").textContent="Doğru cevap: "+q.answer;
 $("bg").textContent="BG: "+q.bg;
 $("next").classList.remove("hidden");
 updateStats();
}

function updateStats(){
 $("correctN").textContent=correct; $("wrongN").textContent=wrong;
 const answered=correct+wrong;
 $("percent").textContent=answered?Math.round(correct/answered*100)+"%":"0%";
}

function finish(){
 $("bar").style.width="100%";
 $("game").style.display="none"; $("end").classList.add("show");
 const total=correct+wrong, pct=total?Math.round(correct/total*100):0;
 $("finalScore").textContent=`${correct}/${total}`;
 $("finalText").textContent=`Başarı: %${pct} • Yanlış: ${wrong}`;
 $("retryWrong").style.display=savedWrong.size?"block":"none";
}

document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;start()});
$("next").onclick=()=>{i++;render()};
$("restart").onclick=start;
$("again").onclick=start;
$("retryWrong").onclick=()=>{mode="wrong";start()};
start();
</script>
</body>
</html>
