  { q: "12. Как се извършва обменът на данни между отделните компютри при топология \"Звезда\"?", opts: ["Чрез директна размяна на данни (няма междинни станции).", "Последователно от станция на станция.", "Само до определени предварително станции.", "Само чрез централен възел."], a: 4 },

  { q: "14. Как се представят двоичните битове чрез логически нива в код NRZI?", opts: ["При предаване на двоична единица нивото от предходния бит се запазва, а при предаване на двоична нула нивото от предходния бит се променя.", "Двоичната единица се кодира чрез ниско в първата половина на бита и високо ниво във втората му половина, а двоичната нула чрез високо ниво в първата половина на бита и ниско във втората му половина.", "Стойностите на битовете се представят чрез две постоянни логически нива, високо ниво за двоичните единици и ниско ниво за двоичните нули.", "Битовете се кодират по двойки чрез 4 логически нива."], a: 1 },

  { q: "23. Какво е предназначението на представителното ниво от еталонния модел на ISO?", opts: ["Представителното ниво има за цел представяне на данните в единен формат по време на обмена в мрежата.", "Представителното ниво има за цел управление на обмена на данни в двете крайни системи.", "Представителното ниво има за цел управление на обмена между двете крайни системи в мрежата - системата източник и системата краен получател.", "Представителното ниво има за цел прехвърляне на кадри с данни между двете системи като отчита топологията на мрежата."], a: 1 },
  { q: "24. С каква надеждност се характеризира непотвърдената комуникационна услуга?", opts: ["Непотвърдената комуникационна услуга се характеризира с висока надеждност.", "Непотвърдената комуникационна услуга се характеризира с ниска надеждност.", "Непотвърдената комуникационна услуга се характеризира с неопределена надеждност.", "Непотвърдената комуникационна услуга се характеризира се с висока или ниска надеждност в зависимост от типа на съобщителната среда."], a: 2 },

  { q: "26. Как обменят данни компютрите от една и съща и от различни съставни мрежи в Internet?", opts: ["В рамките на всяка съставна мрежа компютрите обменят данни директно един с друг. Компютрите от различни съставни мрежи също обменят данни директно.", "В рамките на всяка съставна мрежа компютрите обменят данни директно един с друг. Компютрите от различни съставни мрежи не могат да обменят данни директно.", "В рамките на всяка съставна мрежа компютрите обменят данни един с друг посредством специализиран сървър. Компютрите от различни съставни мрежи не могат да обменят данни директно.", "В рамките на една съставна мрежа компютрите не могат да обменят данни директно един с друг. Компютрите от различни съставни мрежи могат да обменят данни директно."], a: 2 },
  { q: "27. Какво представа като апаратни средства един маршрутизатор?", opts: ["Маршрутизаторът е специализиран компютър, който има основна функция за разпределянето на динамични IP адреси.", "Маршрутизаторът е специализиран компютър, който притежава повече от един процесор, всеки от които може да работи независимо по своя програма.", "Маршрутизаторът е специализиран компютър, който притежава повече от един мрежови канал, всеки от които може да бъде изграден по различен стандарт.", "Маршрутизаторът е специализиран компютър, който притежава памет с голям обем и позволява дистанционно управление на компютрите от дадена мрежа."], a: 3 },
  { q: "28. Как се получава в компютъра динамичният IP адрес?", opts: ["Динамичният IP адрес се получава в компютъра автоматизирано от специализиран сървър наречен DHCP сървър.", "Динамичният IP адрес се въвежда и запазва в компютъра ръчно от администратора на мрежата или от съответния потребител.", "Динамичният IP адрес се въвежда и запазва в компютъра автоматизирано, според метод указан от администратора на мрежата.", "Динамичният IP адрес се въвежда и запазва в компютъра чрез процедура, дефинирана в протокола IP."], a: 1 },

  { q: "30. Какъв е вътрешният формат на цифровите адреси в Internet според протокола IPv4?", opts: ["Всеки IP адрес вътрешно е разделен е на 2 полета префикс и суфикс.", "Всеки IP адрес вътрешно е разделен е на 3 полета префикс, суфикс и клас.", "Всеки IP адрес вътрешно е разделен е на 2 полета област и подобласт.", "Всеки IP адрес вътрешно е разделен е на 3 полета област, подобласт и компютър."], a: 1 },

const quizDiv = document.getElementById('quiz');

function renderQuiz() {
  quizDiv.innerHTML = '';
  questions.forEach((item, i) => {
    let optsHTML = '';
    item.opts.forEach((opt, j) => {
      optsHTML += `<label id="q${i}-l${j+1}"><input type="radio" name="q${i}" value="${j+1}"> ${j+1}. ${opt}</label>`;
    });
    quizDiv.innerHTML += `
      <div class="question" id="question-${i}">
        <p>${item.q}</p>
        ${optsHTML}
        <button class="btn show-btn" onclick="showAnswer(${i})">Покажи отговора</button>
        <div class="answer" id="answer-${i}">Верен отговор: <strong>${item.a}. ${item.opts[item.a - 1]}</strong></div>
      </div>
    `;
  });
}

renderQuiz();

function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  renderQuiz();
  document.getElementById('score').classList.remove('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswer(i) {
  document.getElementById('answer-' + i).classList.add('show');
}

function checkAll() {
  let correct = 0;
  let answered = 0;
  questions.forEach((item, i) => {
    // clear previous styling
    item.opts.forEach((_, j) => {
      const lbl = document.getElementById(`q${i}-l${j+1}`);
      lbl.classList.remove('correct', 'wrong');
    });
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    // highlight correct answer always
    document.getElementById(`q${i}-l${item.a}`).classList.add('correct');
    if (selected) {
      answered++;
      const val = parseInt(selected.value);
      if (val === item.a) {
        correct++;
      } else {
        document.getElementById(`q${i}-l${val}`).classList.add('wrong');
      }
    }
    document.getElementById('answer-' + i).classList.add('show');
  });
  const score = document.getElementById('score');
  score.innerHTML = `Резултат: <strong>${correct} / ${questions.length}</strong> верни (отговорени: ${answered})`;
  score.classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetAll() {
  questions.forEach((item, i) => {
    const inputs = document.querySelectorAll(`input[name="q${i}"]`);
    inputs.forEach(inp => inp.checked = false);
    item.opts.forEach((_, j) => {
      const lbl = document.getElementById(`q${i}-l${j+1}`);
      lbl.classList.remove('correct', 'wrong');
    });
    document.getElementById('answer-' + i).classList.remove('show');
  });
  document.getElementById('score').classList.remove('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
